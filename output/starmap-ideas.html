<div id="swu-map-ideas" class="viz-carousel" aria-label="Sternenkarten-Konzepte" data-previous-label="Zurück" data-next-label="Weiter">
  <section data-variant="Kosmischer Atlas">
    <div class="swu-concept atlas" aria-label="Kosmischer Atlas">
      <header><span>SWU / KOSMISCHER ATLAS</span><span>Konzept · Beispieldaten</span></header>
      <div class="swu-map"></div>
      <footer><label><input type="checkbox" class="grid-toggle"> Taktisches Raster</label><span class="selection" aria-live="polite">Veyra · Feld 6 | 5</span></footer>
    </div>
  </section>
  <section data-variant="Holografischer Kartentisch" hidden>
    <div class="swu-concept holo" aria-label="Holografischer Kartentisch">
      <header><span>SWU / KOMMANDOTISCH</span><span>Konzept · Beispieldaten</span></header>
      <div class="swu-map"></div>
      <footer><label><input type="checkbox" class="grid-toggle" checked> Taktisches Raster</label><span class="selection" aria-live="polite">Veyra · Feld 6 | 5</span></footer>
    </div>
  </section>
  <section data-variant="Galaktischer Linienplan" hidden>
    <div class="swu-concept transit" aria-label="Galaktischer Linienplan">
      <header><span>SWU / HYPERRAUM-ATLAS</span><span>Konzept · Beispieldaten</span></header>
      <div class="swu-map"></div>
      <footer><span>Schematisch · keine Flugvorschau</span><span class="selection" aria-live="polite">Veyra · Feld 6 | 5</span></footer>
    </div>
  </section>
</div>
<style>
#swu-map-ideas .swu-concept{--space:light-dark(#eaf0f5,#080e1b);--ink:light-dark(#142b43,#dceaf4);--quiet:light-dark(#4e657a,#93a9bc);--line:light-dark(#829db1,#31495d);--signal:light-dark(#126776,#71dfd9);--mist:light-dark(#7794be,#405288);--dust:light-dark(#af81a9,#794369);background:var(--space);color:var(--ink);font:14px/1.5 system-ui,sans-serif;overflow:hidden;border-radius:14px}
#swu-map-ideas header,#swu-map-ideas footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px}
#swu-map-ideas header{border-bottom:1px solid var(--line);padding-right:100px}
#swu-map-ideas header span:last-child{font-size:12px;color:var(--quiet)}
#swu-map-ideas footer{border-top:1px solid var(--line);min-height:60px;box-sizing:border-box;font-size:12px}
#swu-map-ideas label{display:flex;align-items:center;gap:8px}
#swu-map-ideas .swu-map{height:352px;position:relative;overflow:hidden}
#swu-map-ideas .swu-map svg{position:absolute;width:100%;height:100%;inset:0;pointer-events:none}
#swu-map-ideas .star{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border:0;background:transparent;color:var(--ink);font:inherit;display:grid;place-items:center}
#swu-map-ideas .star::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 15px var(--signal)}
#swu-map-ideas .star[aria-pressed=true]::before{outline:1px solid var(--signal);outline-offset:8px}
#swu-map-ideas .star span{position:absolute;top:38px;font-size:12px;white-space:nowrap;background:var(--space);padding:0 4px}
#swu-map-ideas .map-caption{position:absolute;left:18px;top:12px;color:var(--quiet);font-size:12px;letter-spacing:1px}
#swu-map-ideas .transit .star::before{width:10px;height:10px;box-shadow:none;background:var(--space);border:3px solid var(--signal)}
#swu-map-ideas .transit .star span{top:38px}
#swu-map-ideas .grid-lines{opacity:0}
#swu-map-ideas .show-grid .grid-lines{opacity:.38}
@media(max-width:450px){#swu-map-ideas header{padding-left:12px;font-size:12px;min-height:70px;box-sizing:border-box}#swu-map-ideas footer{min-height:88px;padding:12px}#swu-map-ideas .star span{font-size:11px}#swu-map-ideas .swu-map{height:352px}}
</style>
<script>
(() => {
 const root=document.getElementById('swu-map-ideas');
 const systems=[['Neral',.14,.32,3,4],['Veyra',.35,.49,6,5],['Kesh',.55,.27,10,3],['Oris',.76,.40,14,4],['Tal',.64,.75,12,8],['Sarn',.25,.78,5,8]];
 const ns='http://www.w3.org/2000/svg';
 root.querySelectorAll('.swu-concept').forEach((panel,index)=>{
  const map=panel.querySelector('.swu-map');
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('role','img');svg.setAttribute('aria-label',['Organische Nebellandschaft mit sechs Sternensystemen','Schräg projiziertes Raster mit sechs Sternensystemen','Schematisches Routennetz mit sechs Sternensystemen'][index]);map.append(svg);
  const caption=document.createElement('div');caption.className='map-caption';caption.textContent=['DER VEYRA-SCHLEIER','SEKTOR VEYRA / PROJEKTION','VEYRA-KORRIDOR'][index];map.append(caption);
  const positions=index===2?[[.14,.36],[.35,.36],[.55,.36],[.78,.36],[.67,.72],[.25,.72]]:systems.map(s=>[s[1],index===1?.24+s[2]*.68:s[2]]);
  const buttons=systems.map((s,i)=>{
   const b=document.createElement('button');b.type='button';b.className='star cursor-interaction';b.setAttribute('aria-label',s[0]+', Feld '+s[3]+' | '+s[4]);b.setAttribute('aria-pressed',String(i===1));b.innerHTML='<span>'+s[0]+'</span>';b.style.left=positions[i][0]*100+'%';b.style.top=positions[i][1]*100+'%';map.append(b);
   b.addEventListener('click',()=>{buttons.forEach(v=>v.setAttribute('aria-pressed',String(v===b)));panel.querySelector('.selection').textContent=s[0]+' · Feld '+s[3]+' | '+s[4];});return b;
  });
  const state={mist:65};
  function draw(){
   const w=map.clientWidth;if(!w)return;const h=352;svg.replaceChildren();svg.setAttribute('viewBox','0 0 '+w+' '+h);
   function add(tag,attrs,parent=svg){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));parent.append(e);return e;}
   if(index===0){
    const defs=add('defs',{});const filter=add('filter',{id:'swu-soft',x:'-80%',y:'-80%',width:'260%',height:'260%'},defs);add('feGaussianBlur',{stdDeviation:23},filter);
    for(let j=0;j<9;j++){const x=w*(.12+j*.09),y=170+Math.sin(j*.72)*65;add('ellipse',{cx:x,cy:y,rx:w*.16,ry:42,fill:j<5?'var(--mist)':'var(--dust)',opacity:state.mist/180,filter:'url(#swu-soft)'});}
   }
   if(index!==2){
    for(let j=0;j<100;j++)add('circle',{cx:((j*73+17)%997)/997*w,cy:((j*113+11)%353),r:j%9===0?1.2:.55,fill:'var(--ink)',opacity:.18+(j%4)*.12});
    const grid=add('g',{'class':'grid-lines',stroke:'var(--line)','stroke-width':1});
    if(index===0){for(let x=0;x<w;x+=32)add('line',{x1:x,y1:0,x2:x,y2:h},grid);for(let y=0;y<h;y+=32)add('line',{x1:0,y1:y,x2:w,y2:y},grid);}
    else {for(let j=0;j<=16;j++)add('line',{x1:w*.5+(j-8)*w*.034,y1:72,x2:w*.5+(j-8)*w*.09,y2:338},grid);for(let j=0;j<10;j++){const t=j/9,y=72+t*t*266,span=w*(.27+t*t*.45);add('line',{x1:w/2-span,y1:y,x2:w/2+span,y2:y},grid);}}
   }
   const edges=[[0,1],[1,2],[2,3],[1,5],[5,4],[4,3]];
   edges.forEach(([a,b])=>{const p=positions[a],q=positions[b];add('line',{x1:p[0]*w,y1:p[1]*h,x2:q[0]*w,y2:q[1]*h,stroke:'var(--signal)','stroke-width':index===2?3:1.3,opacity:index===2?.85:.4});});
   if(index===1){positions.forEach(p=>{add('ellipse',{cx:p[0]*w,cy:p[1]*h+13,rx:17,ry:6,fill:'none',stroke:'var(--signal)',opacity:.3});add('line',{x1:p[0]*w,y1:p[1]*h,x2:p[0]*w,y2:p[1]*h+13,stroke:'var(--signal)',opacity:.45});});}
  }
  const toggle=panel.querySelector('.grid-toggle');if(toggle){const apply=()=>panel.classList.toggle('show-grid',toggle.checked);toggle.addEventListener('change',apply);apply();}
  new ResizeObserver(draw).observe(map);draw();
  if(globalThis.Tweak&&index===0){const tweak=new Tweak({container:panel,onChange:draw});tweak.addSlider(state,'mist',{label:'Nebeldichte',min:10,max:100,unit:'%'});}
 });
})();
</script>
