services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swuniverse
      POSTGRES_USER: swuniverse
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '5490:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swuniverse']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
